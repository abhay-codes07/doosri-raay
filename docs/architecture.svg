<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">
  <title>Doosri Raay architecture: parent and guardian PWAs, Amplify, API Gateway with JWT, the api Lambda with Cedar, DynamoDB, S3, Step Functions, ladder-task and recovery-agent Lambdas, Bedrock, Polly, and the LocalStack local mode</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10z" fill="#3c3530"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5 0 10z" fill="#8a7f75"/>
    </marker>
  </defs>
  <!-- opaque paper so the diagram reads the same on light and dark pages -->
  <rect width="1200" height="700" fill="#fbf6ee"/>
  <text x="24" y="34" font-size="22" font-weight="700" fill="#1f1a17">Doosri Raay: one SAM stack in ap-south-1, PWA on Amplify Hosting</text>
  <text x="24" y="56" font-size="13" fill="#5a524c">Solid arrows: request path. Dashed: async or callback. Every human step in a state machine is a waitForTaskToken with a deadline from the execution input.</text>

  <!-- ===== clients ===== -->
  <g>
    <rect x="24" y="96" width="196" height="92" rx="10" fill="#e8eef7" stroke="#3b5b8c" stroke-width="2"/>
    <text x="122" y="122" text-anchor="middle" font-weight="700" fill="#1f1a17">Parent PWA</text>
    <text x="122" y="143" text-anchor="middle" font-size="13" fill="#3c3530">Panchang tile: tithi, weather,</text>
    <text x="122" y="160" text-anchor="middle" font-size="13" fill="#3c3530">medicines, photo. Opening = check-in.</text>
    <text x="122" y="178" text-anchor="middle" font-size="13" fill="#3c3530">Puchho buttons, covert triple-tap SOS</text>
  </g>
  <g>
    <rect x="24" y="222" width="196" height="92" rx="10" fill="#e8eef7" stroke="#3b5b8c" stroke-width="2"/>
    <text x="122" y="248" text-anchor="middle" font-weight="700" fill="#1f1a17">Guardian PWA</text>
    <text x="122" y="269" text-anchor="middle" font-size="13" fill="#3c3530">tasks with deadlines, ladder status,</text>
    <text x="122" y="286" text-anchor="middle" font-size="13" fill="#3c3530">checker, recovery case, /demo split view</text>
    <text x="122" y="304" text-anchor="middle" font-size="13" fill="#3c3530">Web Push (VAPID) or 5 s polling</text>
  </g>

  <!-- ===== Amplify ===== -->
  <g>
    <rect x="262" y="160" width="160" height="86" rx="10" fill="#fff3e0" stroke="#b5541c" stroke-width="2"/>
    <text x="342" y="188" text-anchor="middle" font-weight="700" fill="#1f1a17">Amplify Hosting</text>
    <text x="342" y="209" text-anchor="middle" font-size="13" fill="#3c3530">static PWA, SPA rewrite,</text>
    <text x="342" y="227" text-anchor="middle" font-size="13" fill="#3c3530">service worker</text>
  </g>
  <path d="M220 142 L262 190" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M220 268 L262 216" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- ===== Cognito ===== -->
  <g>
    <rect x="470" y="80" width="190" height="60" rx="10" fill="#fff3e0" stroke="#b5541c" stroke-width="2"/>
    <text x="565" y="104" text-anchor="middle" font-weight="700" fill="#1f1a17">Cognito user pool</text>
    <text x="565" y="124" text-anchor="middle" font-size="13" fill="#3c3530">ID token (JWT) on every route</text>
  </g>

  <!-- ===== API Gateway ===== -->
  <g>
    <rect x="470" y="160" width="190" height="86" rx="10" fill="#fff3e0" stroke="#b5541c" stroke-width="2"/>
    <text x="565" y="186" text-anchor="middle" font-weight="700" fill="#1f1a17">API Gateway (HTTP API)</text>
    <text x="565" y="207" text-anchor="middle" font-size="13" fill="#3c3530">JWT authorizer, throttled</text>
    <text x="565" y="225" text-anchor="middle" font-size="13" fill="#3c3530">every route behind it; CORS to app origins</text>
  </g>
  <path d="M422 203 L470 203" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="446" y="196" text-anchor="middle" font-size="12" fill="#5a524c">JWT</text>
  <path d="M565 140 L565 160" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- ===== Lambda api with Cedar ===== -->
  <g>
    <rect x="706" y="150" width="200" height="118" rx="10" fill="#fff3e0" stroke="#b5541c" stroke-width="2"/>
    <text x="806" y="176" text-anchor="middle" font-weight="700" fill="#1f1a17">Lambda api (Python)</text>
    <text x="806" y="196" text-anchor="middle" font-size="13" fill="#3c3530">thin handlers; circleId from</text>
    <text x="806" y="213" text-anchor="middle" font-size="13" fill="#3c3530">the caller's profile, never the request</text>
    <rect x="722" y="224" width="168" height="32" rx="6" fill="#fdf9f2" stroke="#6b3a8c" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="806" y="245" text-anchor="middle" font-size="13" fill="#6b3a8c">Cedar policies (authz) inside</text>
  </g>
  <path d="M660 203 L706 203" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- ===== data stores ===== -->
  <g>
    <rect x="960" y="80" width="216" height="64" rx="10" fill="#eaf4ea" stroke="#2f6b3a" stroke-width="2"/>
    <text x="1068" y="104" text-anchor="middle" font-weight="700" fill="#1f1a17">DynamoDB (single table)</text>
    <text x="1068" y="124" text-anchor="middle" font-size="13" fill="#3c3530">circle, members, check-ins, tasks+tokens, cases</text>
  </g>
  <g>
    <rect x="960" y="160" width="216" height="64" rx="10" fill="#eaf4ea" stroke="#2f6b3a" stroke-width="2"/>
    <text x="1068" y="184" text-anchor="middle" font-weight="700" fill="#1f1a17">S3 uploads bucket</text>
    <text x="1068" y="204" text-anchor="middle" font-size="13" fill="#3c3530">presigned POST, SSE, 7-day expiry, audio cache</text>
  </g>
  <path d="M906 180 L960 118" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M906 196 L960 192" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- ===== Step Functions ===== -->
  <g>
    <rect x="960" y="244" width="216" height="130" rx="10" fill="#eaf4ea" stroke="#2f6b3a" stroke-width="2"/>
    <text x="1068" y="270" text-anchor="middle" font-weight="700" fill="#1f1a17">Step Functions (Standard)</text>
    <text x="1068" y="292" text-anchor="middle" font-size="13" fill="#3c3530">Watch (self-renewing, one per check-in)</text>
    <text x="1068" y="310" text-anchor="middle" font-size="13" fill="#3c3530">&#8594; Ladder: guardian 1 &#8594; 2 &#8594; neighbour &#8594; 112</text>
    <text x="1068" y="328" text-anchor="middle" font-size="13" fill="#3c3530">RecoveryCase: Extract &#8594; Confirm &#8594; Build</text>
    <text x="1068" y="346" text-anchor="middle" font-size="13" fill="#3c3530">&#8594; Call1930 &#8594; NCRPFiled &#8594; MRM</text>
    <text x="1068" y="365" text-anchor="middle" font-size="12" fill="#2f6b3a">waitForTaskToken + TimeoutSecondsPath</text>
  </g>
  <path d="M906 230 L960 290" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="922" y="252" font-size="12" fill="#5a524c">StartExecution</text>
  <path d="M960 330 C 930 330, 930 262, 906 262" stroke="#8a7f75" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ad)"/>

  <!-- ===== workers ===== -->
  <g>
    <rect x="470" y="300" width="190" height="72" rx="10" fill="#fff3e0" stroke="#b5541c" stroke-width="2"/>
    <text x="565" y="326" text-anchor="middle" font-weight="700" fill="#1f1a17">Lambda classify-worker</text>
    <text x="565" y="346" text-anchor="middle" font-size="13" fill="#3c3530">one Converse call, forced tool use,</text>
    <text x="565" y="363" text-anchor="middle" font-size="13" fill="#3c3530">none / watching / likely</text>
  </g>
  <path d="M760 268 L620 300" stroke="#8a7f75" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text x="678" y="276" font-size="12" fill="#8a7f75">async invoke</text>

  <g>
    <rect x="706" y="300" width="200" height="72" rx="10" fill="#fff3e0" stroke="#b5541c" stroke-width="2"/>
    <text x="806" y="326" text-anchor="middle" font-weight="700" fill="#1f1a17">Lambda ladder-task</text>
    <text x="806" y="346" text-anchor="middle" font-size="13" fill="#3c3530">writes a TASK item with the token,</text>
    <text x="806" y="363" text-anchor="middle" font-size="13" fill="#3c3530">deadline and Web Push to the guardian</text>
  </g>
  <path d="M960 320 L906 330" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M906 355 C 940 355, 950 400, 980 374" stroke="#8a7f75" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text x="932" y="398" font-size="12" fill="#8a7f75">SendTaskSuccess from</text>
  <text x="932" y="412" font-size="12" fill="#8a7f75">POST /tasks/:id/complete</text>

  <g>
    <rect x="706" y="400" width="200" height="86" rx="10" fill="#fff3e0" stroke="#b5541c" stroke-width="2"/>
    <text x="806" y="426" text-anchor="middle" font-weight="700" fill="#1f1a17">Lambda recovery-agent</text>
    <text x="806" y="446" text-anchor="middle" font-size="13" fill="#3c3530">Strands agent, container image (ECR)</text>
    <text x="806" y="463" text-anchor="middle" font-size="13" fill="#3c3530">tools are plain code; rules as data;</text>
    <text x="806" y="480" text-anchor="middle" font-size="13" fill="#3c3530">deterministic path if the agent fails</text>
  </g>
  <path d="M1000 374 L860 400" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- ===== models ===== -->
  <g>
    <rect x="960" y="430" width="216" height="86" rx="10" fill="#f3e8f7" stroke="#6b3a8c" stroke-width="2"/>
    <text x="1068" y="456" text-anchor="middle" font-weight="700" fill="#1f1a17">Amazon Bedrock (Converse)</text>
    <text x="1068" y="476" text-anchor="middle" font-size="13" fill="#3c3530">global.anthropic.claude-sonnet-4-6</text>
    <text x="1068" y="493" text-anchor="middle" font-size="13" fill="#3c3530">fallback Haiku 4.5 on throttle</text>
    <text x="1068" y="509" text-anchor="middle" font-size="12" fill="#6b3a8c">global inference profile, called from ap-south-1</text>
  </g>
  <path d="M906 450 L960 470" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M660 372 C 700 420, 880 520, 960 500" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <g>
    <rect x="470" y="410" width="190" height="72" rx="10" fill="#f3e8f7" stroke="#6b3a8c" stroke-width="2"/>
    <text x="565" y="436" text-anchor="middle" font-weight="700" fill="#1f1a17">Amazon Polly</text>
    <text x="565" y="456" text-anchor="middle" font-size="13" fill="#3c3530">Hindi clip of the I4C line for Puchho,</text>
    <text x="565" y="473" text-anchor="middle" font-size="13" fill="#3c3530">synthesised once, cached in S3</text>
  </g>
  <path d="M740 268 L600 410" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <g>
    <rect x="262" y="300" width="160" height="72" rx="10" fill="#fff3e0" stroke="#b5541c" stroke-width="2"/>
    <text x="342" y="326" text-anchor="middle" font-weight="700" fill="#1f1a17">SSM Parameter Store</text>
    <text x="342" y="346" text-anchor="middle" font-size="13" fill="#3c3530">VAPID private key,</text>
    <text x="342" y="363" text-anchor="middle" font-size="13" fill="#3c3530">SecureString, read with decryption</text>
  </g>
  <path d="M706 250 C 600 300, 500 336, 422 336" stroke="#3c3530" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M262 336 C 200 336, 150 336, 122 314" stroke="#8a7f75" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ad)"/>
  <text x="180" y="352" font-size="12" fill="#8a7f75">Web Push</text>

  <!-- ===== operations band ===== -->
  <g font-size="13">
    <rect x="24" y="400" width="398" height="82" rx="10" fill="#f4efe6" stroke="#8a7f75" stroke-width="1.5"/>
    <text x="40" y="424" font-weight="700" fill="#1f1a17">Operations (same stack)</text>
    <text x="40" y="446" fill="#3c3530">CloudWatch Logs: one 14-day group per function and per state machine</text>
    <text x="40" y="463" fill="#3c3530">X-Ray tracing on every function &#183; ECR image built by sam build</text>
    <text x="40" y="478" fill="#3c3530">AWS Budgets at USD 20 / 50 (when BudgetEmail is set)</text>
  </g>

  <!-- ===== local mode ===== -->
  <g font-size="13">
    <rect x="24" y="520" width="1152" height="150" rx="12" fill="#f4f4f4" stroke="#5a524c" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="40" y="548" font-size="16" font-weight="700" fill="#1f1a17">Local mode: docker-compose + LocalStack + SAM local (make local-*)</text>
    <rect x="40" y="566" width="230" height="84" rx="8" fill="#eaf4ea" stroke="#2f6b3a" stroke-width="1.5"/>
    <text x="155" y="590" text-anchor="middle" font-weight="700" fill="#1f1a17">LocalStack</text>
    <text x="155" y="610" text-anchor="middle" fill="#3c3530">DynamoDB, S3, SSM, Lambda</text>
    <text x="155" y="628" text-anchor="middle" fill="#3c3530">same table and bucket names</text>
    <rect x="290" y="566" width="250" height="84" rx="8" fill="#fff3e0" stroke="#b5541c" stroke-width="1.5"/>
    <text x="415" y="590" text-anchor="middle" font-weight="700" fill="#1f1a17">sam local start-api</text>
    <text x="415" y="610" text-anchor="middle" fill="#3c3530">the api Lambda against LocalStack</text>
    <text x="415" y="628" text-anchor="middle" fill="#3c3530">endpoints (AWS_ENDPOINT_URL)</text>
    <rect x="560" y="566" width="290" height="84" rx="8" fill="#f3e8f7" stroke="#6b3a8c" stroke-width="1.5"/>
    <text x="705" y="590" text-anchor="middle" font-weight="700" fill="#1f1a17">Not in LocalStack community</text>
    <text x="705" y="610" text-anchor="middle" fill="#3c3530">Step Functions and Bedrock: the classifier uses</text>
    <text x="705" y="628" text-anchor="middle" fill="#3c3530">the pattern stub; state machines run in the cloud</text>
    <rect x="870" y="566" width="290" height="84" rx="8" fill="#e8eef7" stroke="#3b5b8c" stroke-width="1.5"/>
    <text x="1015" y="590" text-anchor="middle" font-weight="700" fill="#1f1a17">Frontend: npm run dev</text>
    <text x="1015" y="610" text-anchor="middle" fill="#3c3530">VITE_API_URL to the local API;</text>
    <text x="1015" y="628" text-anchor="middle" fill="#3c3530">unit tests and the eval harness need no AWS</text>
  </g>
</svg>
