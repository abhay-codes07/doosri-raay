# Amplify Hosting build spec for the Vite PWA in frontend/.
# Set VITE_API_URL, VITE_USER_POOL_ID, VITE_USER_POOL_CLIENT_ID (and optionally VITE_REGION,
# VITE_VAPID_PUBLIC_KEY, VITE_DEMO_PARENT_EMAIL) as Amplify environment variables; Vite reads
# them at build time. Add the SPA rewrite rule (see frontend/README.md) in the Amplify console.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
